    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio for Md. Mahfuj Al Enam, a seasoned HR & Administration Professional with expertise in recruitment, performance management, and HR policy." />
    <title>Md. Mahfuj Al Enam – HR & Administration Professional | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Poppins', sans-serif;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-gradient {
            background: linear-gradient(-45deg, #0a192f, #112240, #233554, #0a192f);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            width: 1.25rem;
            height: 1.25rem;
            border-radius: 50%;
            left: -0.625rem;
            top: 0;
            background-color: #64ffda;
            border: 4px solid #112240;
        }
        .dark .timeline-item::before {
             border-color: #112240;
        }
        .light .timeline-item::before {
             border-color: #f0f4f8;
        }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'navy': '#0a192f',
              'light-navy': '#112240',
              'lightest-navy': '#233554',
              'slate': '#8892b0',
              'light-slate': '#a8b2d1',
              'lightest-slate': '#ccd6f6',
              'brand-teal': '#64ffda',
              'brand-blue': '#57cbff',
            },
          },
        },
      }
    </script>
